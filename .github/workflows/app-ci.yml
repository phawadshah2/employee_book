name: app-ci

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read Flutter version
        id: fvm
        run: echo "version=$(jq -er .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --no-pub --fatal-infos

      - name: Test
        run: flutter test --no-pub

  validate-android-build:
    name: Validate Android build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Read Flutter version
        id: fvm
        run: echo "version=$(jq -er .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Configure Java for Flutter
        run: flutter config --jdk-dir="$JAVA_HOME"

      - name: Install dependencies
        run: flutter pub get

      - name: Create temporary CI signing key
        run: python3 .github/scripts/android_ci.py signing-pr

      - name: Validate release APK build
        run: flutter build apk --release --no-pub

      - name: Clean up signing files
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f android/key.properties
          rm -f "$RUNNER_TEMP/employee-book-ci.jks"

  build-apk:
    name: Build signed Android APK
    needs: analyze-and-test
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Read Flutter version
        id: fvm
        run: echo "version=$(jq -er .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Configure Java for Flutter
        run: flutter config --jdk-dir="$JAVA_HOME"

      - name: Install dependencies
        run: flutter pub get

      - name: Restore Android signing files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 .github/scripts/android_ci.py signing-release

      - name: Build release APK
        run: flutter build apk --release --no-pub --build-number="$GITHUB_RUN_NUMBER"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: employee-book-apk-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Prepare Slack success notification
        env:
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
        run: python3 .github/scripts/android_ci.py slack-success

      - name: Send APK and success notification to Slack
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: files.uploadV2
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ${{ runner.temp }}/slack-success.json
          errors: true

      - name: Clean up signing and notification files
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f android/key.properties
          rm -f "$RUNNER_TEMP/employee-book-ci.jks"
          rm -f "$RUNNER_TEMP/slack-success.json"

  notify-failure:
    name: Notify Slack of pipeline failure
    needs:
      - analyze-and-test
      - build-apk
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.analyze-and-test.result == 'failure' ||
       needs.build-apk.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare Slack failure notification
        env:
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          CHECKS_RESULT: ${{ needs.analyze-and-test.result }}
          APK_RESULT: ${{ needs.build-apk.result }}
        run: python3 .github/scripts/android_ci.py slack-failure

      - name: Send failure notification to Slack
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ${{ runner.temp }}/slack-failure.json
          errors: true

      - name: Clean up failure notification
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/slack-failure.json"